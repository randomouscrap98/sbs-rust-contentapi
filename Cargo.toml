[package]
name = "sbs-rust-contentapi"
version = "1.1.1"
edition = "2021"

[workspace]
members = [ "contentapi", "pages", "common" ]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
rusqlite = { version = "0.34.0", features = ["bundled"] }
# sqlite = "0.36.2"

axum = { version = "0.6.18", features = [
    "multipart", "form", "query"
] }
tower = { version = "0.4.13", features = [ "timeout" ] }
tower-http = { version = "0.4.1", features = ["fs", "limit"] } 
tower-cookies = "0.9.0"

serde = { version = "1", features = ["derive"] }
serde_urlencoded = "0.7.1"
serde_json = "1.0"
onestop = { version = "0.0.2", features = ["utils"] }
bbscope = { version = "0.2" }
toml = "0.5.9"

contentapi = { path = "contentapi", features = [ "postdump" ] }
common = { path = "common"}
pages = { path = "pages" }

[features]
perf = ["bbscope/perf"]
